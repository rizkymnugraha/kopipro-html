<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Kopi Botolan Simpel</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        /* Hilangkan panah spinner pada input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .row-enter {
            animation: fadeIn 0.15s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">
    <!-- Card Utama -->
    
    <main class="w-full max-w-xl bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-7">
        <a href="index.html" class="text-slate-500 hover:text-slate-700 text-sm font-medium transition">← Kembali</a>
        
        <!-- Header Simpel & Opsi Pembulatan -->
        <div class="flex flex-wrap items-center justify-between gap-2 mb-5">

            <div>
                <h1 class="text-lg font-bold text-slate-900">Kalkulator Harga Botolan</h1>
                <p class="text-xs text-slate-500 mt-0.5">Basis hitungan otomatis dari 1.000 ml (1 Liter)</p>
            </div>

            <!-- Pilihan Kelipatan Rounding (Default: 1.000 ke atas) -->
            <div class="flex items-center gap-1.5 bg-slate-100 px-2.5 py-1.5 rounded-xl border border-slate-200/70">
                <span class="text-[11px] font-medium text-slate-500">Bulatkan ke:</span>
                <select 
                    id="rounding-step" 
                    onchange="handleRoundingStepChange(this.value)"
                    class="text-xs font-semibold text-slate-700 bg-transparent focus:outline-none cursor-pointer"
                >
                    <option value="1000" selected>1.000 ↑</option>
                    <option value="500">500 ↑</option>
                    <option value="5000">5.000 ↑</option>
                </select>
            </div>
        </div>

        <!-- Label Kolom -->
        <div class="flex items-center gap-2 sm:gap-3 px-1 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400 select-none">
            <div class="w-28 sm:w-32 shrink-0">Ukuran</div>
            <div class="w-3 text-center"></div>
            <div class="flex-1">Harga (Auto)</div>
            <div class="flex-1 text-emerald-700">Rounding</div>
            <div class="w-7 shrink-0"></div>
        </div>

        <!-- Baris Utama (Base 1000 ml) -->
        <div class="flex items-center gap-2 sm:gap-3 pb-4 mb-4 border-b border-slate-100">
            <!-- Ukuran Base: 1000 ml -->
            <div class="flex items-center bg-slate-100 border border-slate-200 rounded-xl px-3 py-2.5 w-28 sm:w-32 shrink-0">
                <span class="font-bold text-slate-700 text-sm sm:text-base select-none">1000</span>
                <span class="ml-auto text-xs sm:text-sm font-medium text-slate-400 select-none">ml</span>
            </div>

            <span class="text-slate-400 font-bold text-base sm:text-lg w-3 text-center select-none">=</span>

            <!-- Input Harga Base 1000 ml -->
            <div class="relative flex-1 flex items-center">
                <input 
                    id="base-price-input" 
                    type="text" 
                    inputmode="numeric"
                    value="95.000" 
                    oninput="handleBasePriceInput(this)"
                    placeholder="0"
                    class="w-full bg-amber-50/70 hover:bg-amber-50 focus:bg-white border border-amber-300 focus:border-amber-500 rounded-xl px-3 py-2.5 font-bold text-slate-900 text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-amber-500/20 transition"
                >
            </div>

            <!-- Rounding Base 1000 ml -->
            <div class="flex-1 bg-emerald-50/50 border border-emerald-200/70 rounded-xl px-3 py-2.5 flex items-center justify-between">
                <span id="base-rounded-price" class="font-bold text-emerald-900 text-sm sm:text-base">95.000</span>
            </div>

            <!-- Spacer agar sejajar dengan baris di bawah yang punya tombol hapus -->
            <div class="w-7 shrink-0"></div>
        </div>

        <!-- Daftar Ukuran Botol Tambahan -->
        <div id="bottle-rows" class="space-y-2.5">
            <!-- Baris ukuran botol di-render lewat JavaScript -->
        </div>

        <!-- Tombol +Add -->
        <div class="mt-5 pt-2">
            <button 
                onclick="addRow()" 
                class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.98] text-white font-semibold text-sm transition shadow-xs cursor-pointer"
            >
                <span>+ Add</span>
            </button>
        </div>

    </main>

    <script>
        // State harga base 1000 ml, kelipatan pembulatan, dan daftar botol
        let basePrice = 95000;
        let roundingStep = 1000;
        let rows = [
            { id: 1, ml: 500 }
        ];

        // Format angka ke format titik ribuan Indonesia (contoh: 95.000)
        function formatNumber(num) {
            const clean = Math.round(Number(num) || 0);
            return clean.toLocaleString('id-ID');
        }

        // Hitung pembulatan ke atas sesuai kelipatan (contoh: 47.500 -> 48.000)
        function calculateRounded(num) {
            const val = Number(num) || 0;
            if (val <= 0) return 0;
            return Math.ceil(val / roundingStep) * roundingStep;
        }

        // Ambil angka murni dari string berformat titik
        function parseRawNumber(str) {
            const digits = String(str).replace(/[^\d]/g, '');
            return digits ? parseInt(digits, 10) : 0;
        }

        // Ketika kelipatan pembulatan diubah
        function handleRoundingStepChange(val) {
            roundingStep = Number(val) || 1000;
            updateCalculatedPrices();
        }

        // Ketika harga 1000 ml diubah
        function handleBasePriceInput(inputEl) {
            const raw = parseRawNumber(inputEl.value);
            basePrice = raw;
            inputEl.value = raw > 0 ? formatNumber(raw) : '';
            updateCalculatedPrices();
        }

        // Ketika ukuran ml pada baris botol diubah
        function handleMlInput(id, val) {
            const item = rows.find(r => r.id === id);
            if (!item) return;
            item.ml = Number(val) || 0;
            
            const calculated = (item.ml / 1000) * basePrice;
            const rounded = calculateRounded(calculated);

            const priceEl = document.getElementById(`price-${id}`);
            if (priceEl) priceEl.textContent = formatNumber(calculated);

            const roundedEl = document.getElementById(`rounded-${id}`);
            if (roundedEl) roundedEl.textContent = formatNumber(rounded);
        }

        // Update semua hasil hitungan tanpa merender ulang input yang sedang diketik
        function updateCalculatedPrices() {
            const baseRoundedEl = document.getElementById('base-rounded-price');
            if (baseRoundedEl) {
                baseRoundedEl.textContent = formatNumber(calculateRounded(basePrice));
            }

            rows.forEach(row => {
                const calculated = (row.ml / 1000) * basePrice;
                const rounded = calculateRounded(calculated);

                const priceEl = document.getElementById(`price-${row.id}`);
                if (priceEl) priceEl.textContent = formatNumber(calculated);

                const roundedEl = document.getElementById(`rounded-${row.id}`);
                if (roundedEl) roundedEl.textContent = formatNumber(rounded);
            });
        }

        // Tambah baris ukuran botol baru
        function addRow() {
            const newId = Date.now();
            rows.push({ id: newId, ml: '' });
            renderRows(newId);
        }

        // Hapus baris ukuran botol
        function removeRow(id) {
            rows = rows.filter(r => r.id !== id);
            renderRows();
        }

        // Render daftar baris ke layar
        function renderRows(focusId = null) {
            const container = document.getElementById('bottle-rows');
            container.innerHTML = '';

            rows.forEach(row => {
                const calculated = ((Number(row.ml) || 0) / 1000) * basePrice;
                const rounded = calculateRounded(calculated);

                const div = document.createElement('div');
                div.className = 'row-enter flex items-center gap-2 sm:gap-3';
                div.innerHTML = `
                    <!-- Input Ukuran Botol (ml) -->
                    <div class="relative flex items-center bg-white border border-slate-300 focus-within:border-slate-900 focus-within:ring-2 focus-within:ring-slate-900/10 rounded-xl px-3 py-2.5 w-28 sm:w-32 shrink-0 transition">
                        <input 
                            id="ml-input-${row.id}"
                            type="number" 
                            min="0"
                            value="${row.ml}" 
                            placeholder="0"
                            oninput="handleMlInput(${row.id}, this.value)"
                            class="w-full font-semibold text-slate-900 text-sm sm:text-base bg-transparent focus:outline-none pr-1.5"
                        >
                        <span class="text-xs sm:text-sm font-medium text-slate-400 select-none">ml</span>
                    </div>

                    <span class="text-slate-400 font-bold text-base sm:text-lg w-3 text-center select-none">=</span>

                    <!-- Hasil Hitungan Otomatis -->
                    <div class="flex-1 bg-slate-50 border border-slate-200/80 rounded-xl px-3 py-2.5 flex items-center justify-between">
                        <span id="price-${row.id}" class="font-semibold text-slate-600 text-sm sm:text-base">${formatNumber(calculated)}</span>
                        <span class="hidden sm:inline text-[10px] font-medium text-slate-400 select-none">auto</span>
                    </div>

                    <!-- Hasil Rounding (Pembulatan ke Atas) -->
                    <div class="flex-1 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2.5 flex items-center justify-between">
                        <span id="rounded-${row.id}" class="font-bold text-emerald-800 text-sm sm:text-base">${formatNumber(rounded)}</span>
                    </div>

                    <!-- Tombol Hapus Baris -->
                    <button 
                        onclick="removeRow(${row.id})" 
                        title="Hapus baris"
                        class="w-7 h-8 rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition shrink-0 cursor-pointer"
                    >
                        ✕
                    </button>
                `;
                container.appendChild(div);
            });

            // Otomatis fokus ke input ml yang baru ditambahkan
            if (focusId) {
                const targetInput = document.getElementById(`ml-input-${focusId}`);
                if (targetInput) targetInput.focus();
            }
        }

        // Inisialisasi tampilan awal
        renderRows();
    </script>
</body>
</html>
